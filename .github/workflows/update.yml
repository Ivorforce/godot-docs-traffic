name: update

on:
  schedule:
    - cron: "43 4 2 * *"   # 04:43 UTC on the 2nd of each month
  workflow_dispatch: {}

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # incremental fetches only months not already stored, always refreshing
      # the newest. On the 2nd, last month is the newest complete one.
      - run: python3 scripts/fetch.py incremental
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}

      # Clones godot-docs unfiltered (~740 MB) into .cache/. Not restored from
      # actions/cache: a cache that size takes about as long to restore as the
      # clone takes to make.
      - run: python3 scripts/inventory.py

      - run: python3 scripts/aggregate.py

      # After aggregate, not before, so the invariants run against the month
      # about to be committed rather than the one already in git.
      - run: python3 -m unittest discover tests

      # The payload has been right every time the page was wrong, so the deno
      # tests — which render against the data.js just written — are the half of
      # the suite a bad month is most likely to trip.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read tests/

      - name: commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.js
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: monthly update $(date -u +%Y-%m-%d)"
            git push
          fi

      # Pushes made with GITHUB_TOKEN do not trigger the branch-based Pages
      # build; request one explicitly. 409 = a build is already queued.
      - name: trigger Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
